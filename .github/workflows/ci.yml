name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Skipped until the web app exists
      - name: Build web app
        if: hashFiles('apps/web/package.json') != ''
        run: npm run build:web

      # Proves the mobile app still bundles with the shared package
      - name: Bundle mobile app
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir /tmp/export
