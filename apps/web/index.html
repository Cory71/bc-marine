<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1628" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f7fb" media="(prefers-color-scheme: light)" />
    <!-- Apply a saved Light/Dark choice before the page draws, so it doesn't flash -->
    <script>
      try {
        var savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch (error) {}
    </script>
    <title>BC Marine: Tides, Wind & Marine Forecasts for the BC Coast</title>
    <meta
      name="description"
      content="Live tides, wind, waves, currents and Environment Canada marine forecasts for 50+ locations on the British Columbia coast."
    />
    <!-- Lighthouse icon: SVG for modern browsers, PNG fallback, and a home-screen icon for iPhones -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open connections to the data APIs while the app is still loading -->
    <link rel="preconnect" href="https://api-iwls.dfo-mpo.gc.ca" crossorigin />
    <link rel="preconnect" href="https://api.open-meteo.com" crossorigin />
    <link rel="preconnect" href="https://marine-api.open-meteo.com" crossorigin />

    <!-- Link previews (LinkedIn, Slack, messages) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BC Marine: Tides, Wind & Marine Forecasts" />
    <meta
      property="og:description"
      content="Live tides, wind, waves, currents and marine forecasts for the British Columbia coast."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <noscript>BC Marine needs JavaScript to load live marine data.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
