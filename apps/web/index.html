<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1628" />
    <title>BC Marine: Tides, Wind & Marine Forecasts for the BC Coast</title>
    <meta
      name="description"
      content="Live tides, wind, waves, currents and Environment Canada marine forecasts for 40+ locations on the British Columbia coast."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <link rel="preconnect" href="https://api-iwls.dfo-mpo.gc.ca" crossorigin />

    <!-- Link previews (LinkedIn, Slack, messages) -->
    <meta property="og:type" content="website" />

      property="og:description"
      content="Live tides, wind, waves, currents and marine forecasts for the British Columbia coast."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
