<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- BC Marine icon: a lighthouse with its beam, over waves, in the app's navy and sky blue -->
  <defs>
    <clipPath id="tile">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="#0a1628"/>
    <!-- Light beams -->
    <path d="M34 16 L64 6 L64 28 Z" fill="#7ecef4" opacity="0.4"/>
    <path d="M30 16 L0 6 L0 28 Z" fill="#7ecef4" opacity="0.4"/>
    <!-- Roof and lantern -->
    <path d="M23 12 L32 4 L41 12 Z" fill="#7ecef4"/>
    <rect x="25" y="12" width="14" height="9" rx="1.5" fill="#ffffff"/>
    <!-- Tower with a red band -->
    <path d="M24 22 L40 22 L44 52 L20 52 Z" fill="#7ecef4"/>
    <path d="M22.7 32 L41.3 32 L42.3 40 L21.7 40 Z" fill="#ff7b72"/>
    <!-- Sea and a wave crest -->
    <path d="M0 50 Q8 45 16 50 T32 50 T48 50 T64 50 L64 64 L0 64 Z" fill="#1f5f8b"/>
    <path d="M-2 57 Q6 52 14 57 T30 57 T46 57 T62 57 T78 57" fill="none" stroke="#7ecef4" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
